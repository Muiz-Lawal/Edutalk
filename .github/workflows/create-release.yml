name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create a release from'
        required: true
        default: 'release-20260813-1516'
      draft:
        description: 'Create as draft (true/false)'
        required: false
        default: 'true'

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create GitHub release from tag
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
          DRAFT: ${{ github.event.inputs.draft }}
          TOKEN: ${{ secrets.CREATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          echo "Creating release for tag: $TAG"

          # Prepare release body from RELEASE_NOTES.md if present
          if [ -f RELEASE_NOTES.md ]; then
            BODY_JSON=$(python3 - <<PY
import json
try:
    with open('RELEASE_NOTES.md','r', encoding='utf-8') as f:
        b = f.read()
except Exception:
    b = f'Release for {"$TAG"}'
print(json.dumps(b))
PY
)
          else
            BODY_JSON=$(python3 -c "import json; print(json.dumps('Release for %s' % ('$TAG')))"
)
          fi

          DRAFT_BOOL=false
          if [ "${DRAFT,,}" = "true" ]; then
            DRAFT_BOOL=true
          fi

          PAYLOAD=$(printf '{"tag_name":"%s","name":"%s","body":%s,"draft":%s}' "$TAG" "$TAG" "$BODY_JSON" "$DRAFT_BOOL")

          echo "Payload prepared"
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/$REPO/releases -d "$PAYLOAD")

          # Separate body and status
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP code: $HTTP_CODE"
          echo "$HTTP_BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Release created successfully."
          else
            echo "Failed to create release."
            exit 1
          fi
