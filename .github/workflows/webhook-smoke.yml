name: Webhook smoke tests

on:
  push:
    branches: [ agents/continue ]
  workflow_dispatch:
    inputs:
      run_real_provider:
        description: 'Run real-provider e2e tests (requires STRIPE & SENDGRID secrets)'
        required: false
        default: 'false'

jobs:
  webhook-smoke:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URI: mongodb://mongodb:27017/edutalk_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Start backend server (node or docker)
        working-directory: backend
              env:
                MONGODB_URI: ${{ job.services.mongodb.url || env.MONGODB_URI }}
              run: |
                # Wait for MongoDB service to be ready
                for i in {1..20}; do
                  if mongo --eval 'db.adminCommand("ping")' >/dev/null 2>&1; then
                    echo "MongoDB ready"; break
                  fi
                  echo "Waiting for MongoDB..."; sleep 2
                done

                if [[ "${{ github.event.inputs.run_real_provider }}" == 'true' ]]; then
                  echo "Starting services with docker-compose..."
                  docker-compose -f .github/docker-compose.ci.yml up -d --build
                  # wait for backend to become healthy
                  for i in {1..30}; do
                    if curl -sS http://localhost:5001/api/health >/dev/null 2>&1; then
                      echo "Backend healthy"; break
                    fi
                    echo "Waiting for backend..."; sleep 2
                  done
                else
                  echo "Starting backend with in-memory DB mode (spawned by integration script)..."
                  # No explicit backend start here; webhook-integration will spawn backend when START_BACKEND_PROCESS=true
                  sleep 1
                fi

      - name: Run webhook smoke (signed fallback)
        working-directory: backend
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BACKEND_URL: http://localhost:5001
        run: |
          node smoke/webhook-smoke.mjs

      - name: Run webhook integration (end-to-end)
        working-directory: backend
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BACKEND_URL: http://localhost:5001
        run: |
          node smoke/webhook-integration.mjs
